name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes any deploy still waiting or running, so a run stuck
# in the queue cannot hold back later ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the component site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install the Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # The site is served from https://ui.dioxuspress.dev/.
      - name: Build the site
        run: |
          dx build --release --package dioxus-ui-site --platform web
          SITE_DIR="$(find target/dx/dioxus-ui-site/release/web -maxdepth 1 -name public -type d)"
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"
          for wasm in "$SITE_DIR"/assets/*.wasm; do
            wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals -o "$wasm" "$wasm"
          done

      - name: Add route pages
        run: npm run site:pages -- "$SITE_DIR"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
